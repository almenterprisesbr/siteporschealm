<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Porsche Study — Hero Concept</title>
<meta name="description" content="Estudo de estilo de hero section inspirado em revelações automotivas premium. Projeto de portfólio, não-oficial.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PRELOADER -->
  <div class="preloader" id="preloader">
    <svg class="preloader__ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="preloader__ring-track" cx="32" cy="32" r="28"></circle>
      <circle class="preloader__ring-fill" cx="32" cy="32" r="28"></circle>
    </svg>
    <span class="preloader__word">PORSCHE</span>
  </div>

  <!-- NAV -->
  <header class="nav" id="nav">
    <div class="nav__brand">
      <span class="nav__logo">PORSCHE</span>
      <span class="nav__tag">taycan</span>
    </div>

    <nav class="nav__links" aria-label="Navegação principal">
      <a href="#hero">Visão Geral</a>
      <a href="#specs">Ficha Técnica</a>
      <a href="#design">Design</a>
      <a href="#contact">Contato</a>
    </nav>

    <button class="nav__burger" id="navBurger" aria-label="Abrir menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero__stage" id="heroStage">
      <video
        class="hero__video"
        id="heroVideo"
        autoplay muted loop playsinline
        poster="assets/img/hero-poster.jpg">
        <source src="assets/video/hero-car.webm" type="video/webm">
        <source src="assets/video/hero-car.mp4" type="video/mp4">
      </video>
      <div class="hero__lightpool" aria-hidden="true"></div>
      <div class="hero__vignette" aria-hidden="true"></div>
    </div>

    <div class="hero__content">
      <div class="hero__copy">
        <a href="#contact" class="btn btn--pill hero__reveal">
          Explorar
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M1 8h13M9 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="hero__scrollcue hero__reveal" aria-hidden="true">
      <span>role</span>
      <i></i>
    </div>
  </section>

  <footer class="disclaimer">
    Projeto conceitual e não-oficial · peça de portfólio pessoal · sem
    afiliação com a Porsche AG.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
